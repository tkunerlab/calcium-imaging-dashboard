name: tests

on:
  push:
  pull_request:

jobs:
  install-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install ".[test]"
      - name: Run migrated and installation tests
        run: python -m pytest
      - name: Build distribution
        run: python -m build

  windows-installer-smoke:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Run Windows installer
        shell: cmd
        run: install-windows.bat --no-pause
      - name: Verify installed launchers
        shell: cmd
        run: |
          call launch-dashboard.bat --version
          call launch-db-builder.bat --version
