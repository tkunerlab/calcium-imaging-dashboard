[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calcium-imaging-dashboard"
version = "0.1.1"
description = "Local browser applications for building, cleaning, aligning, and matching calcium-imaging data."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "BSD-3-Clause"
authors = [
  { name = "Avi Adlakha" },
]
keywords = ["calcium imaging", "cell registration", "neuroscience", "HDF5"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
  "fastapi>=0.100",
  "uvicorn>=0.22",
  "numpy>=1.22",
  "scipy>=1.8",
  "h5py>=3.6",
  "opencv-python-headless>=4.5",
  "SimpleITK>=2.1",
  "zarr>=2.12,<3",
  "matplotlib>=3.7",
  "openpyxl>=3.1",
]

[project.urls]
Homepage = "https://github.com/tkunerlab/calcium-imaging-dashboard"
Repository = "https://github.com/tkunerlab/calcium-imaging-dashboard"
Issues = "https://github.com/tkunerlab/calcium-imaging-dashboard/issues"
Changelog = "https://github.com/tkunerlab/calcium-imaging-dashboard/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
  "build>=1.2",
  "httpx>=0.27",
  "pytest>=8",
]

[project.scripts]
cell-registration-dashboard = "calcium_imaging_dashboard.cell_registration_dashboard.main:run"
db-builder = "calcium_imaging_dashboard.db_builder.main:run"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"calcium_imaging_dashboard.cell_registration_dashboard" = [
  "frontend/*.html",
  "frontend/assets/*",
  "frontend/images/*",
  "frontend/webfonts/*",
]
"calcium_imaging_dashboard.db_builder" = ["frontend/*.html"]

[tool.setuptools.exclude-package-data]
"*" = ["Thumbs.db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
